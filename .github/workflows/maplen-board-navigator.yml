# Sync Navigator worldId (server) separately from ranking fetch for faster daily exp updates.

name: MapleN Board Navigator

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  workflow_run:
    workflows: ["MapleN Board Pages"]
    types: [completed]
    branches: [main, master]
  schedule:
    # Backup if Pages workflow_run did not fire (JST 10:00)
    - cron: "0 1 * * *"
  workflow_dispatch:

concurrency:
  group: maplen-board-pages
  cancel-in-progress: false

permissions:
  contents: write
  actions: read

jobs:
  build:
    if: |
      github.event_name == 'workflow_dispatch' ||
      github.event_name == 'schedule' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'success' &&
        github.event.workflow_run.event != 'push'
      )
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Preserve ranking database from git
        id: git_db
        run: |
          mkdir -p exp_ranking/bot/data
          if [ -f exp_ranking/bot/data/ranking.db.gz ]; then
            gzip -dc exp_ranking/bot/data/ranking.db.gz > /tmp/ranking.db.from_git
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "git-db-source=ranking.db.gz"
          elif [ -f exp_ranking/bot/data/ranking.db ]; then
            cp exp_ranking/bot/data/ranking.db /tmp/ranking.db.from_git
            echo "exists=true" >> "$GITHUB_OUTPUT"
            echo "git-db-source=ranking.db (legacy)"
          else
            echo "exists=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Restore legacy ranking.db cache (v2 path)
        uses: actions/cache/restore@v4
        with:
          path: exp_ranking/bot/data/ranking.db
          key: exp-ranking-db-v2-${{ github.repository }}
          restore-keys: |
            exp-ranking-db-v2-${{ github.repository }}
            exp-ranking-db-v2-pachimi14/msu-exp-ranking
            exp-ranking-db-v2-${{ github.repository }}

      - name: Preserve legacy DB before v3 restore
        run: |
          mkdir -p exp_ranking/bot/data
          if [ -f exp_ranking/bot/data/ranking.db ]; then
            cp exp_ranking/bot/data/ranking.db exp_ranking/bot/data/ranking.legacy.db
          fi

      - name: Restore ranking data cache
        uses: actions/cache/restore@v4
        with:
          path: exp_ranking/bot/data
          key: maplen-board-data-v4-${{ github.repository }}-meta0
          restore-keys: |
            maplen-board-data-v4-${{ github.repository }}-meta
            exp-ranking-data-v3-${{ github.repository }}-meta
            exp-ranking-data-v3-pachimi14/msu-exp-ranking-meta

      - name: Merge ranking.db from git into working copy
        if: steps.git_db.outputs.exists == 'true'
        working-directory: exp_ranking/bot
        run: |
          python -c "
          from pathlib import Path
          import shutil
          from sqlite_storage import merge_ranking_databases
          git_db = Path('/tmp/ranking.db.from_git')
          work_db = Path('data/ranking.db')
          if not git_db.exists():
              raise SystemExit(0)
          if work_db.exists():
              merged = merge_ranking_databases(work_db, git_db)
              print(f'merged rows from git ranking.db: {merged}')
          else:
              shutil.copy(git_db, work_db)
              print('restored ranking.db from git')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exp_ranking/bot/requirements.txt

      - name: Install bot dependencies
        working-directory: exp_ranking/bot
        run: pip install -r requirements.txt

      - name: Sync Navigator server info
        working-directory: exp_ranking/bot
        env:
          NAVIGATOR_ONLY: "true"
          NAVIGATOR_EXPORT_RANKINGS_JSON: "false"
          NAVIGATOR_REQUEST_DELAY_SEC: "0.35"
          NAVIGATOR_ROTATION_ENABLED: "true"
          NAVIGATOR_ROTATION_EPOCH: "2026-06-12"
          SQLITE_DB_PATH: data/ranking.db
          CHARACTER_META_JSON_PATH: data/character_meta.json
          HYDRATE_META_FROM_PAGES: "false"
          SNAPSHOT_IMPORT_FROM_PAGES: "false"
        run: python main.py

      - name: Count navigator meta for cache key
        id: meta_count
        working-directory: exp_ranking/bot
        run: |
          COUNT=$(python -c "from config import sqlite_db_path; from sqlite_storage import count_character_meta; print(count_character_meta(sqlite_db_path()))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"

      - name: Save ranking data cache
        if: success() && steps.meta_count.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: exp_ranking/bot/data
          key: maplen-board-data-v4-${{ github.repository }}-meta${{ steps.meta_count.outputs.count }}

      - name: Upload ranking.db for commit job
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-db-navigator
          path: exp_ranking/bot/data/ranking.db
          if-no-files-found: ignore
          retention-days: 1

  commit-db:
    needs: build
    if: |
      always() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download ranking.db artifact
        uses: actions/download-artifact@v4
        with:
          name: ranking-db-navigator
          path: exp_ranking/bot/data
        continue-on-error: true

      - name: Commit ranking database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if [ ! -f exp_ranking/bot/data/ranking.db ]; then
            echo "No ranking.db artifact to commit"
            exit 0
          fi
          cp exp_ranking/bot/data/ranking.db /tmp/ranking.db.navigator-artifact
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          cp /tmp/ranking.db.navigator-artifact exp_ranking/bot/data/ranking.db
          if [ -f exp_ranking/bot/data/ranking.db.gz ]; then
            gzip -dc exp_ranking/bot/data/ranking.db.gz > /tmp/ranking.db.remote
            python exp_ranking/bot/merge_db_for_commit.py \
              exp_ranking/bot/data/ranking.db \
              /tmp/ranking.db.remote
          fi
          gzip -n -c exp_ranking/bot/data/ranking.db > exp_ranking/bot/data/ranking.db.gz.tmp
          mv exp_ranking/bot/data/ranking.db.gz.tmp exp_ranking/bot/data/ranking.db.gz
          git rm --cached --ignore-unmatch exp_ranking/bot/data/ranking.db
          git add exp_ranking/bot/data/ranking.db.gz
          if git diff --staged --quiet; then
            echo "No ranking database changes to commit"
            exit 0
          fi
          git commit -m "chore: update ranking.db (navigator) [skip ci]"
          git push origin "HEAD:${{ github.ref_name }}"

      # T12 P2: Release Asset (db-store/ranking.db.gz) を git db.gz コミットと並行して
      # 更新する耐久層の安全網。書込は必ず「現Asset download -> additive-merge
      # (INSERT OR IGNORE, merge_ranking_databases 再利用) -> --clobber upload」の順
      # (INV-2/3)。書き手は pages と navigator の両方(単一書き手にしない、INV-3)。
      # ranking.db は上のステップで git 側とマージ済みの状態がワークツリーに残って
      # いるため、それをそのまま入力にする。git 側の commit/push が失敗しても
      # (concurrency 直列化はしているが念のため)この安全網は独立して試行する。
      # 配信経路(rankings.json)には一切関与しない(INV-1)。
      - name: Persist ranking.db to Release store (P2 parallel safety net)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f exp_ranking/bot/data/ranking.db ]; then
            echo "No local ranking.db to persist to Release store"
            exit 0
          fi
          cd exp_ranking/bot
          python -c "
          from pathlib import Path
          from release_store import sync_db_to_release
          result = sync_db_to_release(Path('data/ranking.db'))
          print(f'release_store sync (navigator): {result}')
          "
