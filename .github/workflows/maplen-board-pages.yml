# Build rankings.json, static web, deploy to GitHub Pages (MapleN Board).
# Discord notifications: planned separately.

name: MapleN Board Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
    paths:
      - "exp_ranking/**"
      - ".github/workflows/maplen-board-pages.yml"
      - "README.md"
  schedule:
    # JST 8:00 に先行起動し、セットアップ後は9:05から公式更新を検知して取得する。
    - cron: "0 23 * * *"
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "ランキング API を再取得する（手動実行時はオン推奨）"
        type: boolean
        default: true

concurrency:
  group: maplen-board-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      deploy: ${{ steps.deploy_gate.outputs.deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # T12 P3: restore source switched from the git-committed db.gz to the
      # Release Asset (db-store/ranking.db.gz, T12 P2). The git db.gz commit
      # itself still runs in the commit-db job below in parallel during this
      # transition (§5 step 2) -- this step only stops *reading* it for
      # restore. `download_current_asset` is reused as-is (its fail-closed
      # not-found detection is exactly what we want to keep, §2.1), but a
      # failure here must not abort the run before the v1(Pages)/v2(shard)
      # fallback layers inside main.py get a chance (§2.3's layered
      # cache -> Release -> v1 -> v2 chain) -- so we catch ReleaseStoreError
      # here and degrade to exists=false rather than failing the step. The
      # actual fail-closed backstop for the whole chain is the truncated
      # publish guard (snapshot_guard.py, §2.4), invoked from main.py after
      # all of cache/Release/v1/v2 restoration completes.
      - name: Restore ranking database from Release
        id: release_db
        working-directory: exp_ranking/bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -c "
          import gzip
          import os
          import shutil
          from pathlib import Path
          from release_store import ReleaseStoreError, download_current_asset

          gz_dest = Path('/tmp/ranking.db.gz.from_release')
          db_dest = Path('/tmp/ranking.db.from_release')
          try:
              restored = download_current_asset(gz_dest)
          except ReleaseStoreError as exc:
              print(f'release restore unavailable (non-fatal, falling back): {exc}')
              restored = False
          if restored:
              with gzip.open(gz_dest, 'rb') as src, open(db_dest, 'wb') as dst:
                  shutil.copyfileobj(src, dst)
              print(f'release-db-bytes={db_dest.stat().st_size}')
          print(f'release-db-restored={restored}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('exists=' + ('true' if restored else 'false'), file=output)
          "

      - name: Restore legacy ranking database cache (v2 path)
        id: legacy_db_cache
        uses: actions/cache/restore@v4
        with:
          path: exp_ranking/bot/data/ranking.db
          key: exp-ranking-db-v2-${{ github.repository }}
          restore-keys: |
            exp-ranking-db-v2-${{ github.repository }}
            exp-ranking-db-v2-pachimi14/msu-exp-ranking
            exp-ranking-db-${{ github.repository }}

      - name: Preserve legacy DB before v3 restore
        run: |
          mkdir -p exp_ranking/bot/data
          if [ -f exp_ranking/bot/data/ranking.db ]; then
            cp exp_ranking/bot/data/ranking.db exp_ranking/bot/data/ranking.legacy.db
            echo "legacy-db-bytes=$(wc -c < exp_ranking/bot/data/ranking.legacy.db)"
          fi

      - name: Restore ranking data cache
        id: ranking_db_cache
        uses: actions/cache/restore@v4
        with:
          path: exp_ranking/bot/data
          key: maplen-board-data-v4-${{ github.repository }}-meta0
          restore-keys: |
            maplen-board-data-v4-${{ github.repository }}-meta
            exp-ranking-data-v3-${{ github.repository }}-meta
            exp-ranking-data-v3-pachimi14/msu-exp-ranking-meta

      - name: Log cache restore
        run: |
          echo "legacy-cache-hit=${{ steps.legacy_db_cache.outputs.cache-hit }}"
          echo "v3-cache-hit=${{ steps.ranking_db_cache.outputs.cache-hit }}"
          echo "release-db=${{ steps.release_db.outputs.exists }}"
          echo "schedule=${{ github.event.schedule }}"
          ls -la exp_ranking/bot/data/ || true

      - name: Merge ranking.db from Release into working copy
        if: steps.release_db.outputs.exists == 'true'
        working-directory: exp_ranking/bot
        run: |
          python -c "
          from pathlib import Path
          import shutil
          from sqlite_storage import merge_ranking_databases
          release_db = Path('/tmp/ranking.db.from_release')
          work_db = Path('data/ranking.db')
          if not release_db.exists():
              raise SystemExit(0)
          if work_db.exists():
              merged = merge_ranking_databases(work_db, release_db)
              print(f'merged rows from Release ranking.db: {merged}')
          else:
              shutil.copy(release_db, work_db)
              print('restored ranking.db from Release')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exp_ranking/bot/requirements.txt

      - name: Install bot dependencies
        working-directory: exp_ranking/bot
        run: pip install -r requirements.txt

      - name: Fetch ranking and export JSON
        id: fetch_ranking
        working-directory: exp_ranking/bot
        env:
          RANKING_MIN_LEVEL: "225"
          RANKING_MAX_PAGES: "800"
          RANKING_REQUEST_DELAY_SEC: "0.8"
          RANKING_UPDATE_POLL_INTERVAL_SEC: "45"
          RANKING_UPDATE_POLL_TIMEOUT_SEC: "1200"
          RANKING_UPDATE_SETTLE_SEC: "45"
          RANKING_FRESHNESS_MIN_CHANGED: "100"
          SNAPSHOT_RETENTION_DAYS: "90"
          MVP_HISTORY_DAYS: "90"
          MVP_EXPORT_TOP_N: "0"
          SQLITE_DB_PATH: data/ranking.db
          MVP_JSON_OUTPUT_PATH: ../web/public/data/rankings.json
          CHARACTER_META_JSON_PATH: data/character_meta.json
          NAVIGATOR_REQUEST_DELAY_SEC: "0.35"
          SKIP_MSU_RANKING_FETCH: ${{ contains(github.event.head_commit.message, '[web-only]') && 'true' || '' }}
          NAVIGATOR_FETCH_ENABLED: "false"
          HYDRATE_META_FROM_PAGES: ${{ contains(github.event.head_commit.message, '[web-only]') && 'false' || 'true' }}
          SNAPSHOT_IMPORT_FROM_PAGES: ${{ contains(github.event.head_commit.message, '[web-only]') && 'false' || 'true' }}
          # T12 P3 §2.3/§5 step 3: explicitly enable the v2-shard recovery
          # layer (era-aware, B'/LULU-062 verified: 374,121/374,121 bit-exact,
          # 0 over-restoration) as the new last-resort tier now that the git
          # db.gz commit is being phased out. Mirrors SNAPSHOT_IMPORT_FROM_PAGES's
          # [web-only] gating above (a pure web-only redeploy fetches nothing,
          # so there is nothing new to reconcile). Under normal operation this
          # is expected to import 0 rows (cache/Release already have every
          # snapshot day) -- see §3 row 8 / S1 in the completion report.
          SNAPSHOT_IMPORT_FROM_V2_SHARDS: ${{ contains(github.event.head_commit.message, '[web-only]') && 'false' || 'true' }}
          PAGES_SITE_URL: https://lulumi-tools.com
          MVP_PAGES_RANKINGS_URL: https://lulumi-tools.com/data/rankings.json
          IMPORT_SNAPSHOTS_JSON: data/seed/rankings_seed.json
          ENFORCE_JST_FETCH_WINDOW: ${{ github.event_name == 'schedule' && 'true' || '' }}
          SKIP_RUN_IF_RANKING_DAY_EXISTS: "true"
          SKIP_DEPLOY_IF_DAY_CAPTURED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          FORCE_RANKING_FETCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fetch && 'true' || '' }}
          SKIP_RUN_MIN_SNAPSHOT_ROWS: "1000"
          # T12 P3 §2.4: diagnostic-only inputs for snapshot_guard's "restore
          # method" log line (restore_method_label). Never used in the
          # guard's pass/fail judgment itself (see config.py comments).
          SNAPSHOT_GUARD_CACHE_HIT: ${{ (steps.ranking_db_cache.outputs.cache-hit == 'true' || steps.legacy_db_cache.outputs.cache-hit == 'true') && 'true' || 'false' }}
          SNAPSHOT_GUARD_RELEASE_RESTORED: ${{ steps.release_db.outputs.exists }}
        run: python main.py

      - name: Check if today's ranking day is already complete
        id: deploy_gate
        run: |
          if [ "${{ contains(github.event.head_commit.message, '[web-only]') }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Web-only redeploy: deploy enabled"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: deploy enabled"
          elif [ -f exp_ranking/bot/data/.ranking_day_complete ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skip deploy: $(cat exp_ranking/bot/data/.ranking_day_complete)"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Count navigator meta for cache key
        id: meta_count
        if: steps.deploy_gate.outputs.deploy == 'true'
        working-directory: exp_ranking/bot
        run: |
          COUNT=$(python -c "from config import sqlite_db_path; from sqlite_storage import count_character_meta; print(count_character_meta(sqlite_db_path()))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "character_meta count=$COUNT"

      - name: Save ranking data cache
        if: success() && steps.deploy_gate.outputs.deploy == 'true' && steps.meta_count.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: exp_ranking/bot/data
          key: maplen-board-data-v4-${{ github.repository }}-meta${{ steps.meta_count.outputs.count }}

      - name: Set up Node.js
        if: steps.deploy_gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: exp_ranking/web/package-lock.json

      - name: Install web dependencies
        if: steps.deploy_gate.outputs.deploy == 'true'
        working-directory: exp_ranking/web
        run: npm ci

      - name: Build web
        if: steps.deploy_gate.outputs.deploy == 'true'
        working-directory: exp_ranking/web
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /
        run: npm run build

      - name: Setup Pages
        if: steps.deploy_gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.deploy_gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: exp_ranking/web/dist

      - name: Upload ranking.db for commit job
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-db
          path: exp_ranking/bot/data/ranking.db
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_try.outcome == 'success' && steps.deployment_try.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_try
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deployment_try.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment_try.outcome == 'failure'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deploy succeeded
        if: steps.deployment_try.outcome == 'failure' && steps.deployment.outcome != 'success'
        run: |
          echo "Pages deployment failed after retry"
          exit 1

  commit-db:
    needs: build
    if: |
      always() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download ranking.db artifact
        uses: actions/download-artifact@v4
        with:
          name: ranking-db
          path: exp_ranking/bot/data
        continue-on-error: true

      - name: Commit ranking database
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git remote set-url origin "https://x-access-token:${GITHUB_TOKEN}@github.com/${{ github.repository }}.git"
          if [ ! -f exp_ranking/bot/data/ranking.db ]; then
            echo "No ranking.db artifact to commit"
            exit 0
          fi
          cp exp_ranking/bot/data/ranking.db /tmp/ranking.db.pages-artifact
          git fetch origin "${{ github.ref_name }}"
          git rebase "origin/${{ github.ref_name }}"
          if [ -f exp_ranking/bot/data/ranking.db.gz ]; then
            gzip -dc exp_ranking/bot/data/ranking.db.gz > exp_ranking/bot/data/ranking.db
            python exp_ranking/bot/merge_db_for_commit.py \
              exp_ranking/bot/data/ranking.db \
              /tmp/ranking.db.pages-artifact
          else
            cp /tmp/ranking.db.pages-artifact exp_ranking/bot/data/ranking.db
          fi
          gzip -n -c exp_ranking/bot/data/ranking.db > exp_ranking/bot/data/ranking.db.gz.tmp
          mv exp_ranking/bot/data/ranking.db.gz.tmp exp_ranking/bot/data/ranking.db.gz
          git rm --cached --ignore-unmatch exp_ranking/bot/data/ranking.db
          git add exp_ranking/bot/data/ranking.db.gz
          if git diff --staged --quiet; then
            echo "No ranking database changes to commit"
            exit 0
          fi
          SNAPSHOT_DATE=""
          if [ -f exp_ranking/bot/data/.ranking_day_complete ]; then
            SNAPSHOT_DATE="$(tr -d '\r\n' < exp_ranking/bot/data/.ranking_day_complete)"
          fi
          if [ -n "$SNAPSHOT_DATE" ]; then
            MSG="chore: update ranking.db (${SNAPSHOT_DATE}) [skip ci]"
          else
            MSG="chore: update ranking.db [skip ci]"
          fi
          git commit -m "$MSG"
          git push origin "HEAD:${{ github.ref_name }}"

      # T12 P2: Release Asset (db-store/ranking.db.gz) を git db.gz コミットと並行して
      # 更新する耐久層の安全網。書込は必ず「現Asset download -> additive-merge
      # (INSERT OR IGNORE, merge_ranking_databases 再利用) -> --clobber upload」の順
      # (INV-2/3)。ranking.db は上のステップで git 側とマージ済みの状態が
      # ワークツリーに残っているため、それをそのまま入力にする。
      # git 側の commit/push が失敗しても(concurrency 直列化はしているが念のため)
      # この安全網は独立して試行する。配信経路(rankings.json)には一切関与しない(INV-1)。
      - name: Persist ranking.db to Release store (P2 parallel safety net)
        if: always()
        continue-on-error: true
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f exp_ranking/bot/data/ranking.db ]; then
            echo "No local ranking.db to persist to Release store"
            exit 0
          fi
          cd exp_ranking/bot
          python -c "
          from pathlib import Path
          from release_store import sync_db_to_release
          result = sync_db_to_release(Path('data/ranking.db'))
          print(f'release_store sync (pages): {result}')
          "
