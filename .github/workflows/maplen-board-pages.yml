# Build rankings.json, static web, deploy to GitHub Pages (MapleN Board).
# Discord notifications: planned separately.

name: MapleN Board Pages

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

on:
  push:
    branches: [main, master]
    paths:
      - "exp_ranking/**"
      - ".github/workflows/maplen-board-pages.yml"
      - "README.md"
  schedule:
    # 公式更新は JST 9:00、取得窓は JST 9:05（jst_schedule.JST_FETCH_*）。
    # GitHub のスケジューラ遅延は実測で中央値 +58分・最大 +223分(同リポ Navigator)。
    # 遅れて到着しても待機で吸収できるよう、取得窓に対して十分な余裕を取る。
    # 分値 7 は毎時0分の混雑ピーク回避（GitHub 公式が毎時0分の混雑を明言。
    # アドバイザー裁定 2026-08-08）。
    #
    # 4本化(IMPL_PLAN_cron-redundancy §2.1、2026-08-28): GitHub のスケジューラが
    # cron を落とす頻度が急悪化した実測(08-26〜08-28に発火本数が2→1→0本と悪化)を
    # 受け、当たりくじの本数を増やす。20:07Z より前には増やせない: bot の
    # jst_schedule.MAX_WAIT_SEC(=360分=6h)と timeout-minutes(=330、下記)の両方に
    # 収まる必要があり、この上限を超えると wait_until_jst_fetch_window は「警告して
    # 取得へ進む」実装のため、取得窓の前に取りに行って validate_ranking_freshness が
    # stale 判定で run を失敗させてしまう(早すぎる cron は害になる)。よって
    # 20:07Z(JST 5:07、待機238分)を先頭に固定し、そこから1時間刻みで
    # 23:07Z(JST 8:07、待機58分。取得25分を足しても timeout-minutes 330 未満)まで
    # 4本を並べる。bot 側(MAX_WAIT_SEC・main.py の取得/リトライ/スキップ判定)は
    # 一切変更しない。
    - cron: "7 20 * * *"   # JST 5:07 — 余裕 238分（実測最大 +223分をカバー）
    - cron: "7 21 * * *"   # JST 6:07 — 余裕 178分（追加。7 20 がドロップした日の保険）
    - cron: "7 22 * * *"   # JST 7:07 — 余裕 118分（7 20/7 21 がドロップした日の保険）
    - cron: "7 23 * * *"   # JST 8:07 — 余裕  58分（追加。取得25分を足しても330分以内）
  workflow_dispatch:
    inputs:
      force_fetch:
        description: "ランキング API を再取得する（手動実行時はオン推奨）"
        type: boolean
        default: true

concurrency:
  group: maplen-board-pages
  cancel-in-progress: false

permissions:
  contents: write
  pages: write
  id-token: write
  actions: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 330
    outputs:
      deploy: ${{ steps.deploy_gate.outputs.deploy }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      # T12 P3: restore source switched from the git-committed db.gz to the
      # Release Asset (db-store/ranking.db.gz, T12 P2). The git db.gz commit
      # itself still runs in the commit-db job below in parallel during this
      # transition (§5 step 2) -- this step only stops *reading* it for
      # restore. `download_current_asset` is reused as-is (its fail-closed
      # not-found detection is exactly what we want to keep, §2.1), but a
      # failure here must not abort the run before the v2(shard) fallback
      # layer inside main.py gets a chance (§2.3's layered cache -> Release ->
      # v2 chain; the v1(Pages) tier was removed in T12 P4) -- so we catch
      # ReleaseStoreError here and degrade to exists=false rather than
      # failing the step. The actual fail-closed backstop for the whole
      # chain is the truncated publish guard (snapshot_guard.py, §2.4),
      # invoked from main.py after all of cache/Release/v2 restoration
      # completes.
      - name: Restore ranking database from Release
        id: release_db
        working-directory: exp_ranking/bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -c "
          import gzip
          import os
          import shutil
          from pathlib import Path
          from release_store import ReleaseStoreError, download_current_asset

          gz_dest = Path('/tmp/ranking.db.gz.from_release')
          db_dest = Path('/tmp/ranking.db.from_release')
          try:
              restored = download_current_asset(gz_dest)
          except ReleaseStoreError as exc:
              print(f'release restore unavailable (non-fatal, falling back): {exc}')
              restored = False
          if restored:
              with gzip.open(gz_dest, 'rb') as src, open(db_dest, 'wb') as dst:
                  shutil.copyfileobj(src, dst)
              print(f'release-db-bytes={db_dest.stat().st_size}')
          print(f'release-db-restored={restored}')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as output:
              print('exists=' + ('true' if restored else 'false'), file=output)
          "

      - name: Restore legacy ranking database cache (v2 path)
        id: legacy_db_cache
        uses: actions/cache/restore@v4
        with:
          path: exp_ranking/bot/data/ranking.db
          key: exp-ranking-db-v2-${{ github.repository }}
          restore-keys: |
            exp-ranking-db-v2-${{ github.repository }}
            exp-ranking-db-v2-pachimi14/msu-exp-ranking
            exp-ranking-db-${{ github.repository }}

      - name: Preserve legacy DB before v3 restore
        run: |
          mkdir -p exp_ranking/bot/data
          if [ -f exp_ranking/bot/data/ranking.db ]; then
            cp exp_ranking/bot/data/ranking.db exp_ranking/bot/data/ranking.legacy.db
            echo "legacy-db-bytes=$(wc -c < exp_ranking/bot/data/ranking.legacy.db)"
          fi

      - name: Restore ranking data cache
        id: ranking_db_cache
        uses: actions/cache/restore@v4
        with:
          path: exp_ranking/bot/data
          key: maplen-board-data-v4-${{ github.repository }}-meta0
          restore-keys: |
            maplen-board-data-v4-${{ github.repository }}-meta
            exp-ranking-data-v3-${{ github.repository }}-meta
            exp-ranking-data-v3-pachimi14/msu-exp-ranking-meta

      - name: Log cache restore
        run: |
          echo "legacy-cache-hit=${{ steps.legacy_db_cache.outputs.cache-hit }}"
          echo "v3-cache-hit=${{ steps.ranking_db_cache.outputs.cache-hit }}"
          echo "release-db=${{ steps.release_db.outputs.exists }}"
          echo "schedule=${{ github.event.schedule }}"
          ls -la exp_ranking/bot/data/ || true

      - name: Merge ranking.db from Release into working copy
        if: steps.release_db.outputs.exists == 'true'
        working-directory: exp_ranking/bot
        run: |
          python -c "
          from pathlib import Path
          import shutil
          from sqlite_storage import merge_ranking_databases
          release_db = Path('/tmp/ranking.db.from_release')
          work_db = Path('data/ranking.db')
          if not release_db.exists():
              raise SystemExit(0)
          if work_db.exists():
              merged = merge_ranking_databases(work_db, release_db)
              print(f'merged rows from Release ranking.db: {merged}')
          else:
              shutil.copy(release_db, work_db)
              print('restored ranking.db from Release')
          "

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: exp_ranking/bot/requirements.txt

      - name: Install bot dependencies
        working-directory: exp_ranking/bot
        run: pip install -r requirements.txt

      - name: Fetch ranking and export JSON
        id: fetch_ranking
        working-directory: exp_ranking/bot
        env:
          # snapshot_guard.fetch_release_snapshot_days() shells out to `gh
          # release view`/`gh release download` (via release_store.py) to
          # establish the Release-baseline half of the fail-closed truncated
          # publish guard (§2.4). Without GH_TOKEN/GH_REPO here, that call
          # fails auth and the guard silently falls back to the single
          # public-v2 basis, defeating the intended two-basis redundancy.
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          RANKING_MIN_LEVEL: "225"
          RANKING_MAX_PAGES: "2000"
          RANKING_REQUEST_DELAY_SEC: "0.8"
          RANKING_UPDATE_POLL_INTERVAL_SEC: "45"
          RANKING_UPDATE_POLL_TIMEOUT_SEC: "1200"
          RANKING_UPDATE_SETTLE_SEC: "45"
          RANKING_FRESHNESS_MIN_CHANGED: "100"
          SNAPSHOT_RETENTION_DAYS: "90"
          MVP_HISTORY_DAYS: "90"
          MVP_EXPORT_TOP_N: "0"
          SQLITE_DB_PATH: data/ranking.db
          CHARACTER_META_JSON_PATH: data/character_meta.json
          NAVIGATOR_REQUEST_DELAY_SEC: "0.35"
          SKIP_MSU_RANKING_FETCH: ${{ contains(github.event.head_commit.message, '[web-only]') && 'true' || '' }}
          NAVIGATOR_FETCH_ENABLED: "false"
          # T12 P4: v1 (data/rankings.json) generation, hydrate, and import
          # settings removed here (HYDRATE_META_FROM_PAGES, SNAPSHOT_IMPORT_
          # FROM_PAGES, MVP_JSON_OUTPUT_PATH, MVP_PAGES_RANKINGS_URL). v1 is
          # retired: cache -> Release -> v2 shards is now the full recovery
          # chain (§3.4 of docs/IMPL_PLAN_T12_P4.md; worldId recovery
          # verified W1-W4 before this change).
          # T12 P3 §2.3/§5 step 3: explicitly enable the v2-shard recovery
          # layer (era-aware, B'/LULU-062 verified: 374,121/374,121 bit-exact,
          # 0 over-restoration) as the new last-resort tier now that the git
          # db.gz commit is being phased out. [web-only] gating below mirrors
          # the old SNAPSHOT_IMPORT_FROM_PAGES gating (a pure web-only
          # redeploy fetches nothing, so there is nothing new to reconcile).
          # Under normal operation this is expected to import 0 rows
          # (cache/Release already have every snapshot day) -- see §3 row 8 /
          # S1 in the T12 P3 completion report.
          SNAPSHOT_IMPORT_FROM_V2_SHARDS: ${{ contains(github.event.head_commit.message, '[web-only]') && 'false' || 'true' }}
          PAGES_SITE_URL: https://lulumi-tools.com
          ENFORCE_JST_FETCH_WINDOW: ${{ github.event_name == 'schedule' && 'true' || '' }}
          SKIP_RUN_IF_RANKING_DAY_EXISTS: "true"
          SKIP_DEPLOY_IF_DAY_CAPTURED: ${{ github.event_name == 'schedule' && 'true' || 'false' }}
          FORCE_RANKING_FETCH: ${{ github.event_name == 'workflow_dispatch' && inputs.force_fetch && 'true' || '' }}
          SKIP_RUN_MIN_SNAPSHOT_ROWS: "1000"
          # T12 P3 §2.4: diagnostic-only inputs for snapshot_guard's "restore
          # method" log line (restore_method_label). Never used in the
          # guard's pass/fail judgment itself (see config.py comments).
          SNAPSHOT_GUARD_CACHE_HIT: ${{ (steps.ranking_db_cache.outputs.cache-hit == 'true' || steps.legacy_db_cache.outputs.cache-hit == 'true') && 'true' || 'false' }}
          SNAPSHOT_GUARD_RELEASE_RESTORED: ${{ steps.release_db.outputs.exists }}
        run: python main.py

      - name: Check if today's ranking day is already complete
        id: deploy_gate
        run: |
          if [ "${{ contains(github.event.head_commit.message, '[web-only]') }}" = "true" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Web-only redeploy: deploy enabled"
          elif [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            echo "deploy=true" >> "$GITHUB_OUTPUT"
            echo "Manual run: deploy enabled"
          elif [ -f exp_ranking/bot/data/.ranking_day_complete ]; then
            echo "deploy=false" >> "$GITHUB_OUTPUT"
            echo "Skip deploy: $(cat exp_ranking/bot/data/.ranking_day_complete)"
          else
            echo "deploy=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Count navigator meta for cache key
        id: meta_count
        if: steps.deploy_gate.outputs.deploy == 'true'
        working-directory: exp_ranking/bot
        run: |
          COUNT=$(python -c "from config import sqlite_db_path; from sqlite_storage import count_character_meta; print(count_character_meta(sqlite_db_path()))")
          echo "count=$COUNT" >> "$GITHUB_OUTPUT"
          echo "character_meta count=$COUNT"

      - name: Save ranking data cache
        if: success() && steps.deploy_gate.outputs.deploy == 'true' && steps.meta_count.outputs.count != '0'
        uses: actions/cache/save@v4
        with:
          path: exp_ranking/bot/data
          key: maplen-board-data-v4-${{ github.repository }}-meta${{ steps.meta_count.outputs.count }}

      - name: Set up Node.js
        if: steps.deploy_gate.outputs.deploy == 'true'
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: exp_ranking/web/package-lock.json

      - name: Install web dependencies
        if: steps.deploy_gate.outputs.deploy == 'true'
        working-directory: exp_ranking/web
        run: npm ci

      - name: Build web
        if: steps.deploy_gate.outputs.deploy == 'true'
        working-directory: exp_ranking/web
        env:
          GITHUB_PAGES: "true"
          PAGES_BASE_PATH: /
        run: npm run build

      - name: Setup Pages
        if: steps.deploy_gate.outputs.deploy == 'true'
        uses: actions/configure-pages@v5

      - name: Upload Pages artifact
        if: steps.deploy_gate.outputs.deploy == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: exp_ranking/web/dist

      - name: Upload ranking.db for commit job
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: ranking-db
          path: exp_ranking/bot/data/ranking.db
          if-no-files-found: ignore
          retention-days: 1

  deploy:
    needs: build
    if: needs.build.outputs.deploy == 'true'
    runs-on: ubuntu-latest
    permissions:
      actions: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment_try.outcome == 'success' && steps.deployment_try.outputs.page_url || steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy to GitHub Pages
        id: deployment_try
        uses: actions/deploy-pages@v4
        continue-on-error: true

      - name: Wait before deploy retry
        if: steps.deployment_try.outcome == 'failure'
        run: sleep 45

      - name: Deploy to GitHub Pages (retry)
        if: steps.deployment_try.outcome == 'failure'
        id: deployment
        uses: actions/deploy-pages@v4

      - name: Verify deploy succeeded
        if: steps.deployment_try.outcome == 'failure' && steps.deployment.outcome != 'success'
        run: |
          echo "Pages deployment failed after retry"
          exit 1

  commit-db:
    needs: build
    if: |
      always() &&
      needs.build.result == 'success'
    runs-on: ubuntu-latest
    permissions:
      # gh release upload requires contents: write (contents: read returns 403)
      contents: write
    # T12 P5.5 §2.1.1: expose the SHA-256 of whatever this job actually
    # persisted to the Release Asset (empty if nothing was persisted), so
    # backup-gdrive (below) can prove -- by re-downloading the Release Asset
    # and comparing hashes -- that it is backing up the exact same DB this
    # run just published, not some other run's Asset.
    outputs:
      sha256: ${{ steps.persist.outputs.sha256 }}
      uploaded: ${{ steps.persist.outputs.uploaded }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Download ranking.db artifact
        uses: actions/download-artifact@v4
        with:
          name: ranking-db
          path: exp_ranking/bot/data
        continue-on-error: true

      # T12 P3 §5 step 5 ("出血停止本体"): the git db.gz commit/push is
      # removed here. The Release Asset persist step below (added in T12 P2
      # as a parallel safety net) is now the *sole* durable store for
      # ranking.db (§2.2) -- git no longer gains a ranking.db.gz commit on
      # every run. `exp_ranking/bot/data/ranking.db.gz` itself is left as-is
      # in the repo (frozen, unread by any workflow as of T12 P3 commit 2/7)
      # -- removing it from git history entirely is a separate, later step
      # (T12 P6, out of scope here per §1 "触らないもの").
      # §5 step 6: `continue-on-error` is intentionally *not* set here anymore
      # (it was, under T12 P2, since git db.gz was still the primary store and
      # this was only a parallel safety net). Now that this is the sole
      # persistence path, a failure here must fail the run visibly rather
      # than be silently swallowed.
      - name: Persist ranking.db to Release store (sole durable store, T12 P3)
        id: persist
        if: always()
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
        run: |
          if [ ! -f exp_ranking/bot/data/ranking.db ]; then
            echo "No local ranking.db to persist to Release store"
            echo "uploaded=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          cd exp_ranking/bot
          python -c "
          import hashlib
          import os
          from pathlib import Path
          from release_store import download_current_asset, sync_db_to_release

          result = sync_db_to_release(Path('data/ranking.db'))
          print(f'release_store sync (pages): {result}')

          output_path = os.environ['GITHUB_OUTPUT']
          if not result.get('uploaded'):
              with open(output_path, 'a', encoding='utf-8') as f:
                  print('uploaded=false', file=f)
              raise SystemExit(0)

          # T12 P5.5 sec2.1.1: re-download the Release Asset we just
          # persisted, and record its SHA-256 as this job's output. This is
          # the sole hand-off medium to backup-gdrive -- it re-downloads the
          # same Asset and compares hashes (V0) to prove it is backing up
          # this exact DB, not a different run's Asset (Release conflict).
          verify_gz = Path('released_asset_for_backup_sha256.db.gz')
          if not download_current_asset(verify_gz):
              raise SystemExit(
                  'release asset re-download for sha256 output failed unexpectedly '
                  '(unexpected: sync_db_to_release just uploaded it)'
              )
          sha256 = hashlib.sha256(verify_gz.read_bytes()).hexdigest()
          print(f'released-db-sha256={sha256}')
          with open(output_path, 'a', encoding='utf-8') as f:
              print(f'sha256={sha256}', file=f)
              print('uploaded=true', file=f)
          "

  # T12 P5.5: daily generational backup to Google Drive, independent of the
  # GitHub Release db-store (§0 "3層の役割分担"). Runs only after commit-db
  # (Release persist) has succeeded and actually persisted a DB this run
  # (§2.1: Release update -> Drive backup -> retention delete, strictly in
  # that order -- delete is always last, enforced inside gdrive_backup_job.py
  # itself, not by this job's structure). `needs: [build, commit-db]` mirrors
  # the plan's explicit dependency chain (commit-db already needs build; build
  # is not otherwise used here since this job re-downloads the Release Asset
  # rather than consuming build's artifact, §2.1.1).
  #
  # SKIP-day / [web-only] runs (no new fetched data) are *not* specially
  # excluded here: commit-db still persists (typically byte-identical)
  # content and this job still uploads+verifies it, but gdrive_backup_job.py's
  # same-UTC-day dedup (gdrive_backup_retention.py, §2.3) collapses same-day
  # duplicates down to the latest on the very next run, so repeat runs on a
  # quiet day are a safe no-op rather than unbounded storage growth.
  backup-gdrive:
    needs: [build, commit-db]
    if: |
      always() &&
      needs.commit-db.result == 'success' &&
      needs.commit-db.outputs.uploaded == 'true'
    runs-on: ubuntu-latest
    permissions:
      # Only re-downloads the Release Asset (gh release download) for V0/V7;
      # never uploads to the Release, so contents: read is enough (least
      # privilege -- contrast with commit-db's contents: write).
      contents: read
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-backup.txt

      - name: Install backup dependencies
        run: pip install -r requirements-backup.txt

      - name: Run Google Drive backup (T12 P5.5)
        working-directory: exp_ranking/bot
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GH_REPO: ${{ github.repository }}
          GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
          GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
          GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
          GDRIVE_BACKUP_FOLDER_ID: ${{ secrets.GDRIVE_BACKUP_FOLDER_ID }}
          GDRIVE_BACKUP_EXPECTED_SHA256: ${{ needs.commit-db.outputs.sha256 }}
          GDRIVE_BACKUP_RUN_ID: ${{ github.run_id }}
        run: python gdrive_backup_job.py
