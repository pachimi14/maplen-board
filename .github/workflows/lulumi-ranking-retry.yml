name: Lulumi Tools Ranking Retry

on:
  schedule:
    # Retry checks at JST 09:40, 10:20, and 11:20.
    - cron: "40 0 * * *"
    - cron: "20 1,2 * * *"
  workflow_run:
    workflows: ["MapleN Board Pages"]
    types: [completed]
  workflow_dispatch:

concurrency:
  group: lulumi-ranking-retry
  cancel-in-progress: false

permissions:
  contents: read
  actions: write

jobs:
  check-and-retry:
    if: |
      github.event_name == 'schedule' ||
      github.event_name == 'workflow_dispatch' ||
      (
        github.event_name == 'workflow_run' &&
        github.event.workflow_run.conclusion == 'failure' &&
        github.event.workflow_run.event == 'schedule'
      )
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # T12 P3: restore source switched from the git-committed db.gz to the
      # Release Asset (db-store/ranking.db.gz, T12 P2, §2.1). This workflow
      # only needs yesterday's row count for the "should we retry" decision
      # below, so a Release-unavailable outcome is non-fatal here (it just
      # leaves row_count at 0, which correctly triggers a retry dispatch --
      # the dispatched maplen-board-pages.yml run has its own full
      # cache/Release/v1/v2 restore chain plus the truncated-publish guard,
      # §2.3/§2.4).
      - name: Restore ranking database from Release
        working-directory: exp_ranking/bot
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: |
          python -c "
          import gzip
          import shutil
          from pathlib import Path
          from release_store import ReleaseStoreError, download_current_asset

          gz_dest = Path('/tmp/ranking.db.gz.from_release')
          db_dest = Path('data/ranking.db')
          db_dest.parent.mkdir(parents=True, exist_ok=True)
          try:
              restored = download_current_asset(gz_dest)
          except ReleaseStoreError as exc:
              print(f'release restore unavailable (non-fatal): {exc}')
              restored = False
          if restored:
              with gzip.open(gz_dest, 'rb') as src, open(db_dest, 'wb') as dst:
                  shutil.copyfileobj(src, dst)
              print(f'release-db-bytes={db_dest.stat().st_size}')
          print(f'release-db-restored={restored}')
          "

      - name: Wait before immediate failure retry
        if: github.event_name == 'workflow_run'
        run: sleep 1200

      - name: Check target ranking day
        id: ranking_day
        env:
          DB_PATH: exp_ranking/bot/data/ranking.db
          MIN_SNAPSHOT_ROWS: "1000"
        run: |
          python - <<'PY'
          import os
          import sqlite3
          from datetime import datetime, timedelta, timezone
          from pathlib import Path

          db_path = Path(os.environ["DB_PATH"])
          min_rows = int(os.environ["MIN_SNAPSHOT_ROWS"])
          target_day = (
              datetime.now(timezone.utc).date() - timedelta(days=1)
          ).isoformat()
          row_count = 0

          if db_path.exists():
              with sqlite3.connect(db_path) as conn:
                  row = conn.execute(
                      "SELECT COUNT(*) FROM ranking_snapshot WHERE snapshot_date = ?",
                      (target_day,),
                  ).fetchone()
                  row_count = int(row[0]) if row else 0

          should_retry = row_count < min_rows
          print(
              f"target_day={target_day} rows={row_count} "
              f"minimum={min_rows} retry={should_retry}"
          )
          with open(os.environ["GITHUB_OUTPUT"], "a", encoding="utf-8") as output:
              output.write(f"target_day={target_day}\n")
              output.write(f"row_count={row_count}\n")
              output.write(f"should_retry={'true' if should_retry else 'false'}\n")
          PY

      - name: Dispatch ranking retry
        if: steps.ranking_day.outputs.should_retry == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh workflow run maplen-board-pages.yml \
            --repo "${GITHUB_REPOSITORY}" \
            --ref main \
            -f force_fetch=true
          echo "Dispatched retry for ${{ steps.ranking_day.outputs.target_day }}"

      - name: Report completed day
        if: steps.ranking_day.outputs.should_retry != 'true'
        run: |
          echo "No retry needed: ${{ steps.ranking_day.outputs.target_day }} has ${{ steps.ranking_day.outputs.row_count }} rows"
